<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | Eranga Perera</title>
<style>
:root{--bg:#09090a;--card:#111113;--ink:#f3f3f1;--mute:#8d8d89;--line:#262629;--acc:#ffb347;--red:#ff6b57;color-scheme:dark;
 --f:'Inter','Helvetica Neue',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
.gate{min-height:100svh;display:grid;place-items:center;padding:20px}
.box{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.box h1{font-size:1.5rem;margin-bottom:6px}.box p{color:var(--mute);font-size:.88rem}
label{display:block;margin:14px 0 0;font-size:.8rem;color:var(--mute)}
input[type=text],input[type=password],textarea{width:100%;margin-top:5px;background:#0a0a0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);outline:0}
.btn{border:1px solid var(--line);background:none;border-radius:99px;padding:9px 18px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--ink);color:#000;border-color:var(--ink);font-weight:600}.btn.p:hover{background:var(--acc);border-color:var(--acc)}
.btn.d{color:var(--red)}.btn:disabled{opacity:.4;cursor:default}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.85rem;color:var(--mute)}
#err{color:var(--red);font-size:.85rem;margin-top:12px;min-height:1.2em}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100svh}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100svh;overflow:auto;display:flex;flex-direction:column;gap:4px}
aside h2{font-size:1rem;padding:4px 10px 14px}
aside button.n{text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--mute)}
aside button.n:hover{color:var(--ink)}aside button.n[aria-current="true"]{background:#1a1a1d;color:var(--ink)}
aside .sp{flex:1}
main{padding:clamp(18px,3vw,40px);padding-bottom:110px;max-width:900px}
main h2{font-size:1.6rem;margin-bottom:6px}.lead{color:var(--mute);margin:0 0 22px;font-size:.9rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.ih{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.ih b{font-weight:600}
.ih div{display:flex;gap:6px}.ih .btn{padding:5px 11px;font-size:.8rem}
.im{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.im img,.im .ph{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#0a0a0b;flex:none;display:grid;place-items:center;color:var(--mute);font-size:.7rem;text-align:center}
.im>div{flex:1}.im input[type=file]{margin-top:8px;font-size:.8rem;color:var(--mute)}
.bar{position:fixed;left:230px;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(18px,3vw,40px);background:rgb(9 9 10/.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
#st{color:var(--mute);font-size:.85rem}#st.ok{color:#7ee0a0}#st.er{color:var(--red)}
.log{white-space:pre-wrap;font-size:.8rem;color:var(--mute);margin-top:10px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}aside h2,aside .sp{display:none}.bar{left:0}}
</style>
</head>
<body>
<div class="gate" id="gate"><form class="box" id="login">
  <h1>Portfolio dashboard</h1>
  <p>Edit your site and publish it to GitHub. Your token stays in this browser and is only sent to api.github.com.</p>
  <label>GitHub username<input type="text" id="o" autocomplete="username" required></label>
  <label>Repository name<input type="text" id="r" placeholder="YOUR-USERNAME.github.io" required></label>
  <label>Branch<input type="text" id="b" value="main" required></label>
  <label>Fine-grained access token<input type="password" id="t" autocomplete="off" required></label>
  <label class="chk"><input type="checkbox" id="rem"> Remember on this device</label>
  <button class="btn p" style="margin-top:18px;width:100%" type="submit">Connect</button>
  <div id="err" role="alert"></div>
</form></div>

<div id="app" hidden>
  <aside id="nav"></aside>
  <main id="panel"></main>
  <div class="bar"><span id="st">Connected</span><div style="display:flex;gap:8px"><button class="btn" id="bk" type="button">Download backup</button><button class="btn p" id="pub" type="button">Publish to GitHub</button></div></div>
</div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEC=[
 {k:'site',l:'Site and contact',t:'obj',d:'Hero text, about copy, links and contact details.',f:[['pill','Hero label'],['name','Your name'],['tagline','Tagline'],['location','Location'],['aboutHeading','About heading'],['aboutText','About text','area'],['portrait','Portrait image','img'],['cv','CV file path (upload the PDF to assets/ on GitHub)'],['whatsapp','WhatsApp link, e.g. https://wa.me/94771234567'],['email','Email'],['linkedin','LinkedIn URL'],['behance','Behance URL'],['instagram','Instagram URL'],['quoteHeading','Statement heading'],['quoteText','Statement text'],['ctaText','Contact paragraph','area']]},
 {k:'stats',l:'About stats',t:'list',d:'Four short facts. Use only verified facts.',n:'title',f:[['title','Title'],['text','Text']]},
 {k:'projects',l:'Featured projects',t:'list',d:'Cards in the project grid. Each opens a case study.',n:'title',f:[['title','Title'],['cat','Category'],['desc','Short description'],['img','Image','img'],['brief','Brief','area'],['role','My role','area'],['result','Outcome (verified results only)','area']]},
 {k:'gallery',l:'Vertical gallery',t:'list',d:'9:16 images for the carousel.',n:'title',f:[['title','Title'],['cat','Category (used for filter tabs)'],['img','Image (9:16 works best)','img'],['brief','Brief','area'],['role','My role','area'],['result','Outcome','area']]},
 {k:'experience',l:'CV timeline',t:'list',d:'Newest first.',n:'title',f:[['title','Role'],['sub','Company and dates'],['desc','Description','area']]},
 {k:'tags',l:'Skills and brands',t:'tags',d:'Separate items with commas. Only list brands you are approved to show.',f:[['software','Software'],['aiTools','AI and workflow tools'],['brands','Brand strip names']]},
 {k:'services',l:'Services',t:'list',d:'Shown as cards with icons.',n:'title',f:[['title','Title'],['text','Description','area']]},
 {k:'voices',l:'Testimonials',t:'list',d:'Real quotes only. Delete all to hide the section.',n:'n',f:[['q','Quote','area'],['n','Name'],['r','Role and company']]},
 {k:'faqs',l:'FAQ',t:'list',d:'Questions and answers.',n:'q',f:[['q','Question'],['a','Answer','area']]}
];
let cfg={},C={},pending={},prev={},sha=null,cur='site',dirty=false;
const store=()=>($('#rem').checked?localStorage:sessionStorage);
const API=(m,p,b)=>fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}/contents/${p}`,{method:m,headers:{Authorization:'Bearer '+cfg.t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:b?JSON.stringify(b):undefined});
const b64=s=>btoa(unescape(encodeURIComponent(s)));const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const status=(m,c='')=>{const e=$('#st');e.textContent=m;e.className=c};

async function load(){
 const r=await API('GET',`content.json?ref=${encodeURIComponent(cfg.b)}`);
 if(r.status===401||r.status===403)throw new Error('Token rejected. Check it has Contents: Read and write for this repository.');
 if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}`,{headers:{Authorization:'Bearer '+cfg.t}});
  if(!rr.ok)throw new Error('Repository not found. Check the username, repository name and token access.');sha=null;C={};return}
 if(!r.ok)throw new Error('GitHub error '+r.status);
 const j=await r.json();sha=j.sha;C=JSON.parse(unb64(j.content));
}
$('#login').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='Connecting…';
 cfg={o:$('#o').value.trim(),r:$('#r').value.trim(),b:$('#b').value.trim(),t:$('#t').value.trim()};
 try{await load();store().setItem('cfg',JSON.stringify(cfg));start()}catch(x){$('#err').textContent=x.message}});
function start(){$('#gate').hidden=true;$('#app').hidden=false;nav();show('site')}
try{const s=JSON.parse(sessionStorage.getItem('cfg')||localStorage.getItem('cfg')||'null');if(s){$('#o').value=s.o;$('#r').value=s.r;$('#b').value=s.b;$('#t').value=s.t}}catch(e){}

function nav(){$('#nav').innerHTML='<h2>Dashboard</h2>'+SEC.map(s=>`<button class="n" data-s="${s.k}" aria-current="${s.k===cur}">${s.l}</button>`).join('')+'<div class="sp"></div><button class="n" id="out">Disconnect</button>'}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='out'){sessionStorage.removeItem('cfg');localStorage.removeItem('cfg');location.reload()}else if(b.dataset.s)show(b.dataset.s)});

const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k]??={},o)[l]=v};
function fld(path,[k,label,type],v){const id=path+'.'+k;
 if(type==='area')return `<label>${label}<textarea data-p="${id}">${esc(v)}</textarea></label>`;
 if(type==='img'){const src=prev[v]||(v?'../'+v:'');return `<div class="im">${src?`<img src="${esc(src)}" alt="" onerror="this.outerHTML='<div class=ph>Not uploaded yet</div>'">`:'<div class="ph">No image</div>'}<div><label style="margin:0">${label}<input type="text" data-p="${id}" value="${esc(v)}"></label><input type="file" accept="image/*" data-up="${id}"></div></div>`}
 return `<label>${label}<input type="text" data-p="${id}" value="${esc(v)}"></label>`}
function show(k){cur=k;nav();const s=SEC.find(x=>x.k===k);let h=`<h2>${s.l}</h2><p class="lead">${s.d}</p>`;
 if(s.t==='obj')h+=`<div class="it">${s.f.map(f=>fld('site',f,get(C,'site.'+f[0]))).join('')}</div>`;
 else if(s.t==='tags')h+=`<div class="it">${s.f.map(([a,l])=>`<label>${l}<input type="text" data-tag="${a}" value="${esc((C[a]||[]).join(', '))}"></label>`).join('')}</div>`;
 else{const a=C[k]||[];h+=a.map((it,i)=>`<div class="it"><div class="ih"><b>${esc(it[s.n]||'Untitled')}</b><div><button class="btn" data-a="up" data-i="${i}" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn" data-a="dn" data-i="${i}" ${i<a.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="btn d" data-a="del" data-i="${i}">Delete</button></div></div>${s.f.map(f=>fld(k+'.'+i,f,it[f[0]])).join('')}</div>`).join('')+`<button class="btn p" data-a="add">Add item</button>`}
 const y=scrollY;$('#panel').innerHTML=h;scrollTo(0,y)}
const mark=()=>{dirty=true;status('Unsaved changes')};
$('#panel').addEventListener('input',e=>{const t=e.target;if(t.dataset.p){set(C,t.dataset.p,t.value);mark()}
 else if(t.dataset.tag){C[t.dataset.tag]=t.value.split(',').map(x=>x.trim()).filter(Boolean);mark()}});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const s=SEC.find(x=>x.k===cur),a=C[cur]??=[],i=+b.dataset.i;
 if(b.dataset.a==='add')a.push(Object.fromEntries(s.f.map(f=>[f[0],''])));
 if(b.dataset.a==='del'&&confirm('Delete this item?'))a.splice(i,1);
 if(b.dataset.a==='up')[a[i-1],a[i]]=[a[i],a[i-1]];if(b.dataset.a==='dn')[a[i+1],a[i]]=[a[i],a[i+1]];
 mark();show(cur)});
async function shrink(f){const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.86)}
$('#panel').addEventListener('change',async e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;
 try{const d=await shrink(t.files[0]),path=t.dataset.up,base=(get(C,path.replace(/\.[^.]+$/,'')+'.title')||path.split('.').pop()).toString().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'image';
  const name=`assets/${base}-${Date.now().toString(36)}.jpg`;pending[name]=d.split(',')[1];prev[name]=d;set(C,path,name);mark();show(cur)}catch(x){status('Could not read that image','er')}});

async function put(path,content,msg){let sh;const g=await API('GET',`${path}?ref=${encodeURIComponent(cfg.b)}`);if(g.ok)sh=(await g.json()).sha;
 const r=await API('PUT',path,{message:msg,content,branch:cfg.b,sha:sh});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(`${path}: ${j.message||r.status}`)}return(await r.json()).content.sha}
$('#pub').onclick=async()=>{const b=$('#pub');b.disabled=true;
 try{const names=Object.keys(pending);let n=0;
  for(const p of names){status(`Uploading image ${++n} of ${names.length}…`);await put(p,pending[p],'Dashboard: add image')}
  status('Saving content…');sha=await put('content.json',b64(JSON.stringify(C,null,2)+'\n'),'Dashboard: update content');pending={};dirty=false;
  status('Published. GitHub Pages usually updates within a minute.','ok')}
 catch(x){status('Failed: '+x.message,'er')}finally{b.disabled=false}};
$('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:'application/json'}));a.download='content-backup.json';a.click()};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
